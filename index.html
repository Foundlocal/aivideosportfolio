<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alam Creations — AI Video Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f2efe9;
    --card:#ffffff;
    --ink:#141414;
    --ink-soft:#6b6660;
    --tan:#c9707f;
    --tan-pale:#f4ece7;
    --blue:#dfe9ea;
    --line:#141414;
    --serif:"Fraunces",Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:960px; margin:0 auto; padding:32px 20px 70px; }
  a{ color:inherit; }

  /* ---------- HEADER ---------- */
  .header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
    background:var(--blue);
    border-radius:6px;
    padding:40px 24px 30px;
    margin-bottom:32px;
  }
  .avatar-wrap{ position:relative; flex-shrink:0; margin-bottom:10px; }
  .avatar-wrap img{
    width:120px; height:120px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--ink);
  }
  .avatar-pin{ display:none; }
  .header-main{ display:flex; flex-direction:column; align-items:center; }
  .brand-title{
    font-family:var(--serif);
    font-weight:900;
    font-size:44px;
    line-height:1;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    text-transform:none;
    color:var(--ink);
  }
  .brand-eyebrow{
    color:var(--ink);
    font-weight:600;
    font-size:11px;
    letter-spacing:.24em;
    text-transform:uppercase;
    margin:0 0 12px;
  }
  .brand-bio{
    font-size:14px;
    line-height:1.55;
    color:var(--ink);
    max-width:420px;
    margin:0 0 18px;
  }
  .email-badge{
    display:flex; align-items:center; gap:9px;
    border:2px solid var(--ink);
    border-radius:24px;
    padding:11px 20px;
    background:#fff;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    color:var(--ink);
    white-space:nowrap;
  }
  .icon-mail{ width:15px; height:15px; flex-shrink:0; }

  /* ---------- CATEGORY SECTIONS ---------- */
  .category{ margin-bottom:38px; }
  .cat-head{
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:6px;
    padding:16px 18px;
    margin-bottom:20px;
  }
  .cat-icon{ width:30px; height:30px; flex-shrink:0; }
  .cat-head-text{ flex:1; }
  .cat-title{
    font-family:var(--serif);
    font-size:22px;
    font-weight:900;
    letter-spacing:-0.005em;
    text-transform:none;
    margin:0 0 2px;
    color:var(--ink);
  }
  .cat-desc{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
  }
  .view-all{
    background:none; border:none; cursor:pointer;
    font-size:11.5px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink);
    display:flex; align-items:center; gap:5px;
    white-space:nowrap;
    padding:2px 0;
  }
  .view-all svg{ width:13px; height:13px; transition:transform .2s ease; }
  .view-all.open svg{ transform:rotate(90deg); }

  .video-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:26px 20px;
  }
  .video-grid .video-card.hidden-extra{ display:none; }

  .video-card{ }
  .phone-frame{
    position:relative;
    width:100%;
    aspect-ratio:9/16;
    background:#111;
    border-radius:6px;
    overflow:hidden;
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .phone-frame img.vid-poster{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .phone-frame iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }
  .phone-play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; border-radius:50%;
    background:#fff;
    border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .phone-play:before{
    content:""; display:block; width:0; height:0;
    border-style:solid; border-width:8px 0 8px 13px;
    border-color:transparent transparent transparent var(--ink);
    margin-left:3px;
  }
  .vcard-title{
    font-family:var(--serif);
    font-size:15.5px; font-weight:700;
    margin:12px 0 4px;
    color:var(--ink);
  }
  .vcard-tag{
    font-size:10.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-soft);
    margin:0 0 8px;
  }
  .vcard-tag .pill{
    background:#fff; color:var(--ink);
    border:1.5px solid var(--ink);
    padding:2px 8px; border-radius:20px;
    margin-right:6px;
  }
  .brief-toggle{
    display:flex; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    font-size:12px; font-weight:600; color:var(--ink);
    padding:0;
  }
  .brief-icon{
    width:15px; height:15px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink); border-radius:50%;
    font-size:11px; line-height:1;
  }
  .brief-panel{
    max-height:0; overflow:hidden;
    transition:max-height .3s ease;
  }
  .video-card.open .brief-panel{ max-height:900px; }
  .brief-inner{
    padding:14px 14px 4px;
    margin-top:10px;
    background:var(--tan-pale);
    border:2px solid var(--ink);
    border-radius:6px;
  }
  .brief-section{ margin-bottom:14px; }
  .brief-section-label{
    font-size:11px; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink);
    margin:0 0 6px;
    padding-bottom:4px;
    border-bottom:1.5px solid var(--ink);
    display:inline-block;
  }
  .brief-desc{
    font-size:13px; line-height:1.55; color:var(--ink);
    margin:0;
  }
  .ref-photo{
    display:block; max-width:100%; max-height:200px;
    width:auto; margin:0 auto 6px; border-radius:6px; object-fit:contain;
    border:2px solid var(--ink);
  }
  .ref-caption{
    font-size:11px; font-style:italic; color:var(--ink-soft);
    margin:0; line-height:1.4;
  }
  .tools-used{
    list-style:none; margin:0; padding:0;
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .tools-used li{
    font-size:11px; font-weight:600; color:var(--ink);
    background:#fff;
    border:1.5px solid var(--ink);
    border-radius:20px;
    padding:5px 11px;
  }
  .tools-used li:before{ content:"✓ "; color:var(--tan); font-weight:800; }

  /* ---------- FOOTER CTA ---------- */
  .cta{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:10px;
    padding:20px 26px;
    margin-top:10px;
    text-decoration:none;
    color:var(--ink);
  }
  .cta-left{ display:flex; align-items:center; gap:12px; font-weight:700; font-size:14.5px; letter-spacing:.04em; text-transform:uppercase; }
  .cta svg{ width:18px; height:18px; }
  .footer-tag{
    text-align:center; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-soft);
    margin-top:26px;
  }

  @media (max-width:720px){
    .video-grid{ grid-template-columns:repeat(2,1fr); }
    .brand-title{ font-size:30px; }
  }
  @media (max-width:460px){
    .video-grid{ grid-template-columns:1fr 1fr; gap:18px 14px; }
  }
</style>
</head>

function videoCardHTML(v, idx){
  const tag = TAGS[v.id] || "AI VIDEO";
  const posterSrc = v.thumb ? v.thumb : 'https://img.youtube.com/vi/'+v.id+'/hqdefault.jpg';
  return `
  <div class="video-card" data-idx="${idx}">
    <div class="phone-frame" data-vid="${v.id}" data-title="${v.title}">
      <img class="vid-poster" src="${posterSrc}" alt="${v.title} thumbnail" loading="lazy">
      <div class="phone-play"></div>
    </div>
    <p class="vcard-title">${v.title}</p>
    <p class="vcard-tag"><span class="pill">${tag}</span>15 SEC</p>
    <button class="brief-toggle" data-toggle>
      <span class="brief-icon">+</span> Creative Brief
    </button>
    <div class="brief-panel">
      <div class="brief-inner">
        ${v.referenceImg ? `
        <div class="brief-section">
          <p class="brief-section-label">Reference Photo</p>
          <img class="ref-photo" src="${v.referenceImg}" alt="Reference photo used to create this ad">
          <p class="ref-caption">This is the original reference photo used to create this AI ad.</p>
        </div>` : ''}
        <div class="brief-section">
          <p class="brief-section-label">Description</p>
          <p class="brief-desc">${v.desc}</p>
        </div>
        <div class="brief-section" style="margin-bottom:2px;">
          <p class="brief-section-label">Tools Used</p>
          <ul class="tools-used">${TOOLS.map(t=>`<li>${t}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
  </div>`;
}

function renderCategories(){
  const root = document.getElementById('categories');
  let html = '';
  Object.keys(DATA).forEach(key=>{
    const cat = DATA[key];
    const showToggle = cat.videos.length > 3;
    html += `
    <div class="category">
      <div class="cat-head">
        <span class="cat-icon">${ICONS[cat.icon]}</span>
        <div class="cat-head-text">
          <p class="cat-title">${cat.title}</p>
          <p class="cat-desc">${cat.desc}</p>
        </div>
        ${showToggle ? `<button class="view-all" data-viewall="${key}">View All <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>` : ''}
      </div>
      <div class="video-grid" data-grid="${key}">
        ${cat.videos.map((v,i)=> {
          const extra = showToggle && i >= 3 ? ' hidden-extra' : '';
          return videoCardHTML(v, key+'-'+i).replace('class="video-card"', `class="video-card${extra}"`);
        }).join('')}
      </div>
    </div>`;
  });
  root.innerHTML = html;

  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const card = btn.closest('.video-card');
      card.classList.toggle('open');
      btn.querySelector('.brief-icon').textContent = card.classList.contains('open') ? '×' : '+';
    });
  });

  document.querySelectorAll('.phone-frame').forEach(frame=>{
    frame.addEventListener('click', ()=>{
      const id = frame.getAttribute('data-vid');
      const title = frame.getAttribute('data-title');
      frame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" title="${title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    }, { once:true });
  });

  document.querySelectorAll('[data-viewall]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.getAttribute('data-viewall');
      const grid = document.querySelector(`[data-grid="${key}"]`);
      const isOpen = btn.classList.toggle('open');
      grid.querySelectorAll('.video-card').forEach((card,i)=>{
        if(i>=3) card.classList.toggle('hidden-extra', !isOpen);
      });
      btn.childNodes[0].textContent = isOpen ? 'View Less ' : 'View All ';
    });
  });
}
