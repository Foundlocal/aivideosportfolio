<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alam Creations — AI Video Portfolio</title>
<style>
  :root{
    --cream:#f3ecdd;
    --manila:#f0cf9e;
    --manila-deep:#e2b779;
    --ink:#221d15;
    --ink-soft:#4a4236;
    --line:rgba(34,29,21,0.18);
    --pink:#e39ab0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Courier New", Courier, monospace;
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- LANDING VIEW ---------- */
  #landing{
    max-width:760px;
    margin:0 auto;
    padding:28px 0 60px;
  }
  .landing-frame{
    position:relative;
    width:100%;
    line-height:0;
  }
  .landing-frame img{
    width:100%;
    display:block;
    border-radius:2px;
  }
  .hotspot{
    position:absolute;
    left:0;
    width:100%;
    background:transparent;
    border:1px solid transparent;
    cursor:pointer;
    padding:0;
    margin:0;
    transition:background .18s ease, border-color .18s ease;
  }
  .hotspot:hover, .hotspot:focus-visible{
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(34,29,21,0.35);
    outline:none;
  }
  .hotspot:hover .hs-tag, .hotspot:focus-visible .hs-tag{
    opacity:1;
    transform:translateY(0);
  }
  .hs-tag{
    position:absolute;
    right:10px;
    bottom:8px;
    background:var(--ink);
    color:var(--cream);
    font-size:11px;
    letter-spacing:.08em;
    padding:4px 9px;
    border-radius:2px;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .18s ease, transform .18s ease;
    pointer-events:none;
  }
  .landing-note{
    text-align:center;
    font-size:12px;
    letter-spacing:.12em;
    color:var(--ink-soft);
    margin-top:18px;
    text-transform:uppercase;
  }

  .info-panel{
    position:absolute;
    font-family:"Courier New", Courier, monospace;
    color:var(--ink);
    line-height:1.35;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .info-panel .ip-label{
    font-size:11px;
    font-weight:bold;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .info-panel .ip-email{
    font-size:12px;
    margin:0;
    word-break:break-all;
  }
  .info-panel .ip-email a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid rgba(34,29,21,0.4);
  }

  /* ---------- CATEGORY VIEW ---------- */
  #category{
    display:none;
    max-width:760px;
    margin:0 auto;
    padding:26px 18px 70px;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--ink);
    color:var(--ink);
    font-family:inherit;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:8px 14px;
    border-radius:2px;
    cursor:pointer;
  }
  .back-link:hover{ background:var(--ink); color:var(--cream); }

  .cat-header{
    margin:26px 0 6px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
  }
  .cat-eyebrow{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .cat-title{
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-size:38px;
    margin:4px 0 8px;
  }
  .cat-desc{
    font-size:13.5px;
    color:var(--ink-soft);
    max-width:560px;
    line-height:1.5;
  }

  .video-list{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .video-card{
    background:var(--manila);
    border:1px solid var(--manila-deep);
    border-radius:3px;
    overflow:hidden;
  }
  .video-card-head{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:none;
    border:none;
    font-family:inherit;
    text-align:left;
    padding:16px 18px;
    cursor:pointer;
    color:var(--ink);
  }
  .video-card-head:hover{ background:rgba(255,255,255,0.18); }
  .vch-left{ display:flex; align-items:baseline; gap:10px; }
  .vch-num{ font-size:11px; color:var(--ink-soft); letter-spacing:.06em; }
  .vch-title{ font-size:15px; font-weight:bold; letter-spacing:.01em; }
  .vch-icon{
    font-size:16px;
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .video-card.open .vch-icon{ transform:rotate(45deg); }

  .video-card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .28s ease;
    background:rgba(255,255,255,0.35);
  }
  .video-card.open .video-card-body{ max-height:900px; }
  .vcb-inner{ padding:4px 18px 20px; }

  .video-embed{
    position:relative;
    width:100%;
    padding-top:177.7%; /* vertical short-form default */
    background:#000;
    border-radius:2px;
    overflow:hidden;
    margin-bottom:14px;
  }
  .video-embed.wide{ padding-top:56.25%; }
  .video-embed iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:0;
  }

  .vcb-label{
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .vcb-desc{
    font-size:13.5px;
    line-height:1.55;
    margin:0 0 16px;
    color:var(--ink);
  }
  .tools-used{
    list-style:none;
    margin:0;
    padding:0;
    font-size:12.5px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .tools-used li:before{ content:"✓ "; }

  .watch-link{
    display:inline-block;
    margin-top:14px;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-decoration:none;
    border-bottom:1px solid var(--ink);
    padding-bottom:1px;
  }

  .video-embed{ cursor:pointer; }
  .video-embed .vid-poster{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .video-embed .vid-play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:58px; height:58px; border-radius:50%;
    background:rgba(20,15,10,0.62); display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .video-embed .vid-play:before{
    content:""; display:block; width:0; height:0;
    border-style:solid; border-width:10px 0 10px 16px;
    border-color:transparent transparent transparent #f3ecdd;
    margin-left:4px;
  }

  @media (max-width:520px){
    .cat-title{ font-size:28px; }
    .vch-title{ font-size:13.5px; }
  }
</style>
</head>

      <div class="video-card-body">
        <div class="vcb-inner">
          <div class="${embedClass}" data-vid="${v.id}" data-title="${v.title}">
            <img class="vid-poster" src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.title} thumbnail" loading="lazy">
            <span class="vid-play"></span>
          </div>
          <p class="vcb-label">Description</p>
          <p class="vcb-desc">${v.desc}</p>
          <p class="vcb-label">Tools Used</p>
          <ul class="tools-used">${TOOLS.map(t=>`<li>${t}</li>`).join('')}</ul>
          <a class="watch-link" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Watch on YouTube →</a>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.video-card-head').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.closest('.video-card').classList.toggle('open');
      const icon = btn.querySelector('.vch-icon');
      icon.textContent = btn.closest('.video-card').classList.contains('open') ? '×' : '+';
    });
  });

  list.querySelectorAll('.video-embed').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-vid');
      const title = el.getAttribute('data-title');
      el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" title="${title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    }, { once:true });
  });

  document.getElementById('landing').style.display='none';
  document.getElementById('category').style.display='block';
  window.scrollTo(0,0);
}

document.querySelectorAll('.hotspot[data-cat]').forEach(btn=>{
  btn.addEventListener('click', ()=> openCategory(btn.getAttribute('data-cat')));
});
</script>
</body>
</html>
